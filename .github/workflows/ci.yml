name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore backend/Erp.slnx
      - name: Format (lint)
        run: dotnet format backend/Erp.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build backend/Erp.slnx --no-restore -c Release
      - name: Contrato OpenAPI commitado bate com a API
        run: git diff --exit-code -- backend/openapi
      - name: Migrations em dia com o modelo
        run: dotnet tool restore && dotnet ef migrations has-pending-model-changes --project backend/src/Erp.Infrastructure --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cliente OpenAPI commitado bate com o contrato
        run: npm run api:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
