<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-style="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ERP Demo – protótipo de redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fafafa; --card:#ffffff; --sidebar:#ffffff; --fg:#09090b; --muted:#f4f4f5; --muted-fg:#71717a;
  --border:#e4e4e7; --input:#d4d4d8; --primary:#18181b; --primary-fg:#fafafa; --ring:#71717a; --accent:#f4f4f5;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --radius:8px; --shadow:0 1px 2px rgba(9,9,11,.05); --shadow-lg:0 10px 30px -8px rgba(9,9,11,.18);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09090b; --card:#111113; --sidebar:#0c0c0e; --fg:#fafafa; --muted:#1c1c1f; --muted-fg:#a1a1aa;
    --border:#27272a; --input:#3f3f46; --primary:#fafafa; --primary-fg:#18181b; --ring:#a1a1aa; --accent:#1f1f23;
    --ok:#4ade80; --ok-bg:rgba(74,222,128,.14); --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14); --bad:#f87171; --bad-bg:rgba(248,113,113,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 10px 30px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#09090b; --card:#111113; --sidebar:#0c0c0e; --fg:#fafafa; --muted:#1c1c1f; --muted-fg:#a1a1aa;
  --border:#27272a; --input:#3f3f46; --primary:#fafafa; --primary-fg:#18181b; --ring:#a1a1aa; --accent:#1f1f23;
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.14); --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14); --bad:#f87171; --bad-bg:rgba(248,113,113,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 10px 30px -8px rgba(0,0,0,.6);
}
/* Direção: Linear */
:root[data-style="linear"][data-theme="light"]{--bg:#f7f8fa;--border:#e3e5ea;--primary:#5e6ad2;--primary-fg:#fff;--ring:#5e6ad2;--accent:#eef0fb;--muted:#f1f2f6;--radius:8px}
:root[data-style="linear"][data-theme="dark"]{--bg:#0d0e12;--card:#14151a;--sidebar:#101116;--border:#23252d;--primary:#7c85e6;--primary-fg:#0b0b14;--ring:#7c85e6;--accent:#1b1d2a;--muted:#191a21;--radius:8px}
/* Direção: Warm */
:root[data-style="warm"][data-theme="light"]{--bg:#faf8f5;--card:#fffdfa;--sidebar:#fffdfa;--border:#e8e2d9;--muted:#f3efe8;--accent:#f3efe8;--muted-fg:#78716c;--primary:#292524;--primary-fg:#faf8f5;--ring:#78716c;--radius:10px}
:root[data-style="warm"][data-theme="dark"]{--bg:#12100e;--card:#1a1816;--sidebar:#151311;--border:#2e2a26;--muted:#231f1c;--accent:#262220;--primary:#f5f0e8;--primary-fg:#1c1917;--ring:#a8a29e;--radius:10px}
/* Direção: Fintech */
:root[data-style="fintech"][data-theme="light"]{--bg:#f8fafc;--border:#e2e8f0;--muted:#f1f5f9;--muted-fg:#64748b;--primary:#059669;--primary-fg:#fff;--ring:#059669;--accent:#ecfdf5;--radius:10px}
:root[data-style="fintech"][data-theme="dark"]{--bg:#0b1118;--card:#111a23;--sidebar:#0e151c;--border:#1e2a36;--muted:#17212b;--accent:#10261f;--primary:#34d399;--primary-fg:#022c22;--ring:#34d399;--radius:10px}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{height:100%;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.ic{flex:none}
.mono{font-family:var(--mono);font-size:12.5px}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.app{display:flex;height:100%}

/* sidebar */
.sidebar{width:240px;flex:none;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px;transition:width .18s ease}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 10px}
.logo{width:32px;height:32px;border-radius:calc(var(--radius) + 0px);background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-weight:600;flex:none}
.brand b{display:block;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.brand span{display:block;font-size:12px;color:var(--muted-fg);line-height:1.2}
.glabel{font-size:12px;color:var(--muted-fg);padding:16px 10px 6px;font-weight:500}
.navitem{display:flex;gap:10px;align-items:center;height:34px;padding:0 10px;border-radius:calc(var(--radius) - 2px);color:var(--muted-fg);font-weight:500;position:relative;width:100%;text-align:left;transition:background .12s,color .12s}
.navitem:hover{background:var(--accent);color:var(--fg)}
.navitem.active{background:var(--accent);color:var(--fg)}
.navitem.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.sfoot{margin-top:auto;border-top:1px solid var(--border);padding-top:8px;display:grid;gap:2px}
.app.collapsed .sidebar{width:64px}
.app.collapsed .lbl,.app.collapsed .brand div,.app.collapsed .glabel{display:none}
.app.collapsed .navitem{justify-content:center;padding:0}
.app.collapsed .glabel+*{margin-top:0}
.app.collapsed .brand{justify-content:center;padding:4px 0 10px}

/* topbar */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--bg)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted-fg);flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.crumbs button{color:var(--muted-fg)}
.crumbs button:hover{color:var(--fg)}
.crumbs .cur{color:var(--fg);font-weight:500}
.cmd{display:flex;align-items:center;gap:8px;height:34px;width:min(360px,34vw);padding:0 8px 0 12px;border:1px solid var(--border);background:var(--card);border-radius:var(--radius);color:var(--muted-fg);box-shadow:var(--shadow)}
.cmd:hover{border-color:var(--input)}
.cmd span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border);background:var(--muted);color:var(--muted-fg);border-radius:5px;padding:1px 6px;line-height:1.5}
.tright{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:6px}
.env{font-size:12px;font-weight:500;color:var(--warn);background:var(--warn-bg);padding:3px 9px;border-radius:999px;white-space:nowrap;margin-right:6px}
.stylepick{position:relative;display:flex;align-items:center;gap:6px;height:32px;padding:0 8px 0 10px;border:1px dashed var(--input);border-radius:var(--radius);color:var(--muted-fg);font-size:13px}
.stylepick select{appearance:none;-webkit-appearance:none;background:transparent;border:0;padding:0 2px;font-weight:500;color:var(--fg);cursor:pointer;outline-offset:6px}
.stylepick option{color:#111}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:calc(var(--radius) - 1px);color:var(--muted-fg);transition:background .12s,color .12s}
.iconbtn:hover{background:var(--accent);color:var(--fg)}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn:disabled:hover{background:none;color:var(--muted-fg)}
.user{display:flex;align-items:center;gap:10px;margin-left:8px;padding-left:12px;border-left:1px solid var(--border)}
.avatar{width:28px;height:28px;border-radius:999px;background:var(--accent);color:var(--fg);display:grid;place-items:center;font-size:12px;font-weight:600;border:1px solid var(--border);flex:none}
.user b{display:block;font-weight:500;line-height:1.15;font-size:13px}
.user small{display:block;color:var(--muted-fg);font-size:12px;line-height:1.15}

/* content */
.content{flex:1;overflow:auto;padding:28px 32px 40px}
.page{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page.fill{min-height:100%;height:100%}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.03em}
h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.015em}
.sub{margin:6px 0 0;color:var(--muted-fg)}
.pact{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--radius);font-weight:500;white-space:nowrap;border:1px solid transparent;transition:background .12s,border-color .12s,opacity .12s,transform .06s}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--primary);color:var(--primary-fg);box-shadow:var(--shadow)}
.btn.primary:hover{opacity:.9}
.btn.outline{background:var(--card);border-color:var(--border);box-shadow:var(--shadow)}
.btn.outline:hover{background:var(--accent);border-color:var(--input)}
.btn.ghost:hover{background:var(--accent)}
.btn.sm{height:32px;padding:0 12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* cards, stats */
.card{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}
.stat{padding:16px 20px 14px;text-align:left;border-right:1px solid var(--border);position:relative;transition:background .12s}
.stat:last-child{border-right:0}
button.stat:hover{background:var(--muted)}
.stat.on{background:var(--accent)}
.stat.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--primary)}
.stat .k{color:var(--muted-fg);font-size:13px}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.25;margin:2px 0}
.stat .d{font-size:12.5px;color:var(--muted-fg)}

/* table */
.tcard{flex:1;min-height:420px;display:flex;flex-direction:column;overflow:hidden}
.tools{display:flex;gap:10px;padding:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.search{position:relative;flex:1;min-width:220px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-fg)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.search input{padding-left:36px;padding-right:36px}
.count{margin-left:auto;color:var(--muted-fg);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{flex:1;min-height:0;overflow-x:auto}
.tin{min-width:900px;height:100%;display:flex;flex-direction:column}
.cols{display:grid;grid-template-columns:minmax(240px,2.4fr) 120px 70px 130px 100px 100px 84px;align-items:center;column-gap:12px;padding:0 16px}
.thead{height:40px;flex:none;color:var(--muted-fg);font-size:12.5px;font-weight:500;background:var(--muted);border-bottom:1px solid var(--border)}
.thead .r,.tr .r{text-align:right}
.thead .sorted{color:var(--fg);display:inline-flex;gap:4px;align-items:center}
.tbody{flex:1;min-height:0;overflow-y:auto;position:relative}
.spacer{position:relative}
.rows{display:block}
.tr{height:52px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.tr:hover{background:color-mix(in srgb,var(--muted) 70%,transparent)}
.tr .pn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .pc{color:var(--muted-fg);font-size:12.5px}
.tr .num{text-align:right;font-variant-numeric:tabular-nums}
.tr .sku{color:var(--muted-fg)}
.tr .act{display:flex;justify-content:flex-end;gap:2px}
.low{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end;color:var(--warn);font-weight:500}
.low i{width:6px;height:6px;border-radius:99px;background:var(--warn)}
.empty{display:grid;place-items:center;text-align:center;padding:64px 24px;color:var(--muted-fg);gap:6px;flex:1}
.empty .tile{width:44px;height:44px;border-radius:12px;background:var(--muted);display:grid;place-items:center;margin:0 auto 8px;color:var(--fg)}
.empty h3{margin:0;color:var(--fg);font-size:15px;font-weight:600}
.empty p{margin:0 0 10px;max-width:360px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.off{background:var(--muted);color:var(--muted-fg)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.line{border:1px solid var(--border);color:var(--fg);background:transparent}
.badge.code{background:var(--accent);color:var(--fg);font-family:var(--mono);font-size:11.5px;border-radius:6px;height:21px;padding:0 7px}
.badge i{width:6px;height:6px;border-radius:99px;background:currentColor}

/* inputs */
.field{display:grid;gap:7px;min-width:0}
.field>label{font-size:13px;font-weight:500}
.field>label em{color:var(--bad);font-style:normal;margin-left:2px}
.input{width:100%;height:38px;padding:0 12px;border:1px solid var(--input);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s;text-align:left}
.input::placeholder{color:var(--muted-fg);opacity:.8}
.input:hover{border-color:color-mix(in srgb,var(--input) 60%,var(--muted-fg))}
.input:focus,.input:focus-visible,.input.open{outline:0;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 28%,transparent)}
.input.err{border-color:var(--bad)}
.input.err:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 25%,transparent)}
textarea.input{height:auto;min-height:96px;padding:10px 12px;resize:vertical;font-family:inherit;line-height:1.5}
.select{display:flex;align-items:center;justify-content:space-between;gap:8px}
.select span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.select .ic{color:var(--muted-fg)}
.select .pre{color:var(--muted-fg);margin-right:6px}
.hint{margin:0;font-size:12.5px;color:var(--muted-fg)}
.errmsg{margin:0;font-size:12.5px;color:var(--bad)}
.affix{position:relative}
.affix .suf{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted-fg);pointer-events:none}
.affix .input{padding-right:34px}
.switch{width:38px;height:22px;border-radius:99px;background:var(--input);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:99px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--primary-fg)}
.swrow{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:14px;border:1px solid var(--border);border-radius:var(--radius)}
.swrow b{display:block;font-weight:500}
.swrow p{margin:2px 0 0;color:var(--muted-fg);font-size:13px}

/* sections */
.sec-h{display:flex;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.sec-h .tile{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.sec-h b{display:block;font-weight:600;letter-spacing:-.01em}
.sec-h small{display:block;color:var(--muted-fg);font-size:13px}
.sec-b{padding:20px;display:grid;gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.editgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.stack{display:grid;gap:20px}
.sumcard{padding:20px;position:sticky;top:0}
.sumcard .name{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:2px 0 10px}
.sumcard .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.margin{border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:var(--muted);margin-bottom:14px}
.margin .top{display:flex;justify-content:space-between;align-items:center}
.margin .lab{color:var(--muted-fg);font-size:13px}
.margin .big{font-size:32px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.margin.t-ok .big{color:var(--ok)}.margin.t-warn .big{color:var(--warn)}.margin.t-bad .big{color:var(--bad)}
.bar{height:6px;border-radius:99px;background:var(--border);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:currentColor;transition:width .25s ease}
.t-ok .bar i{color:var(--ok)}.t-warn .bar i{color:var(--warn)}.t-bad .bar i{color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px}
.kv span{color:var(--muted-fg)}
.kv b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.savebar{position:sticky;bottom:12px;display:flex;align-items:center;gap:10px;padding:12px 14px 12px 20px;box-shadow:var(--shadow-lg);z-index:5}
.savebar .dirty{margin-right:auto;display:flex;align-items:center;gap:8px;color:var(--muted-fg);font-size:13px;opacity:0;transition:opacity .15s}
.savebar .dirty.on{opacity:1}
.savebar .dirty i{width:7px;height:7px;border-radius:99px;background:var(--warn)}

/* users table */
.utable{width:100%;border-collapse:collapse}
.utable th{height:40px;padding:0 20px;text-align:left;font-size:12.5px;font-weight:500;color:var(--muted-fg);background:var(--muted);border-bottom:1px solid var(--border)}
.utable td{height:56px;padding:0 20px;border-bottom:1px solid var(--border)}
.utable tr:last-child td{border-bottom:0}
.utable .who{display:flex;align-items:center;gap:10px;font-weight:500}
.tfoot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border);color:var(--muted-fg);font-size:13px}
.tfoot>div{display:flex;gap:8px}
.card.clip{overflow:hidden}
.utable td.r,.utable th.r{text-align:right}

/* popovers, dialogs, toasts */
#pop{position:fixed;z-index:60;display:none;background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 2px);box-shadow:var(--shadow-lg);padding:4px;max-height:320px;overflow:auto;animation:pin .12s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(-3px) scale(.98)}to{opacity:1;transform:none}}
.pop-search{display:flex;align-items:center;gap:8px;padding:0 10px;height:36px;border-bottom:1px solid var(--border);margin:-4px -4px 4px;color:var(--muted-fg)}
.pop-search input{flex:1;border:0;background:transparent;outline:0;color:var(--fg);height:100%}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:calc(var(--radius) - 2px);white-space:nowrap}
.opt:hover,.opt.hl{background:var(--accent)}
.opt .chk{width:16px;flex:none;color:var(--fg)}
.opt.danger{color:var(--bad)}
.opt .sub2{margin-left:auto;color:var(--muted-fg);font-size:12.5px;padding-left:16px}
.pop-empty{padding:14px;text-align:center;color:var(--muted-fg)}
#overlay{position:fixed;inset:0;z-index:50;display:none;background:rgba(9,9,11,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:16px;animation:fin .15s ease-out}
#overlay.top{align-items:flex-start;padding-top:14vh}
@keyframes fin{from{opacity:0}to{opacity:1}}
.dlg{width:min(440px,100%);background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 6px);box-shadow:var(--shadow-lg);padding:22px;animation:din .18s ease-out}
@keyframes din{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.dlg h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em}
.dlg>p{margin:4px 0 18px;color:var(--muted-fg)}
.dlg .body{display:grid;gap:14px}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.pal{width:min(560px,100%);background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 6px);box-shadow:var(--shadow-lg);overflow:hidden;animation:din .16s ease-out}
.pal .in{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:1px solid var(--border);color:var(--muted-fg)}
.pal .in input{flex:1;border:0;background:transparent;outline:0;font-size:15px;color:var(--fg);height:100%}
.pal .list{padding:6px;max-height:340px;overflow:auto}
.pal .grp{font-size:12px;color:var(--muted-fg);padding:8px 10px 4px}
#toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:70}
.toast{display:flex;gap:12px;align-items:flex-start;min-width:260px;max-width:360px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 2px);box-shadow:var(--shadow-lg);animation:tin .22s ease-out}
.toast.out{opacity:0;transform:translateY(6px);transition:all .2s}
.toast .ic{color:var(--ok);margin-top:1px}
.toast b{font-weight:500;display:block}
.toast p{margin:2px 0 0;color:var(--muted-fg);font-size:13px}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:1100px){.env{display:none}.editgrid{grid-template-columns:1fr}.sumcard{position:static}}
@media (max-width:900px){
  .sidebar{width:64px}
  .sidebar .lbl,.sidebar .brand div,.sidebar .glabel{display:none}
  .sidebar .navitem{justify-content:center;padding:0}
  .sidebar .brand{justify-content:center}
  .user div{display:none}.user{padding-left:8px;margin-left:2px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--border)}
  .content{padding:20px 16px 32px}
  .topbar{padding:0 14px}
  .g2,.g3{grid-template-columns:1fr}
  .stylepick span.t{display:none}
}
@media (max-width:620px){.cmd{display:none}.tright{flex:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"><div id="view"></div></main>
  </div>
</div>
<div id="pop" role="menu"></div>
<div id="overlay"></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const nf=new Intl.NumberFormat('pt-BR');
const fmtInt=n=>nf.format(n);
const cf=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmtBRL=n=>cf.format(n).replace(/\u00a0/g,' ');
const pf=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Lucide-style icons (inline, no network) */

 receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',

 trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',

 power:'<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>',
 palette:'<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',

 cash:'<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',

 shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
 box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>'
};
const ic=(n,s=16)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- data ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const CATS=[['Livros','LIV'],['Eletrônicos','ELE'],['Higiene pessoal','HIG'],['Papelaria','PAP'],['Jardinagem','JAR'],['Bebidas','BEB'],['Utilidades domésticas','UTI'],['Iluminação','ILU'],['Limpeza','LIM'],['Embalagens','EMB'],['Calçados','CAL'],['Saúde','SAU']];
const ADJ=['Ergonômico','Rústico','Compacto','Premium','Resistente','Elegante','Leve','Moderno','Clássico','Industrial'];
const MAT=['Aço','Atum','Algodão','Borracha','Concreto','Congelado','Fresco','Granito','Madeira','Plástico','Couro','Vidro'];
const state={
  view:'products',filter:'all',q:'',cat:'',stock:'all',editing:null,
  units:[['CX','Caixa',10080],['DZ','Dúzia',9984],['G','Grama',10045],['KG','Quilograma',10102],['L','Litro',9942],['M','Metro',9940],['ML','Mililitro',10009],['PAR','Par',9816],['PCT','Pacote',10040],['UN','Unidade',10046]],
  settings:{razao:'ERP Demo Comércio',cnpj:'',desc:'10',neg:false}
};
const DESC='Linha pensada para unir durabilidade e acabamento, com ótimo custo-benefício no uso diário.';
const data=(()=>{
  const r=rng(42),N=24,out=new Array(N),codes=state.units.map(u=>u[0]);
  for(let i=0;i<N;i++){
    const c=Math.floor(r()*CATS.length),price=Math.round((50+r()*3300)*100)/100,m=.2+r()*.35;
    out[i]={id:i,name:`${ADJ[Math.floor(r()*ADJ.length)]} ${MAT[Math.floor(r()*MAT.length)]} ${MAT[Math.floor(r()*MAT.length)]} ${MAT[Math.floor(r()*MAT.length)]}`.split(' ').slice(0,4).join(' '),
      c,sku:CATS[c][1]+'-'+String(Math.floor(r()*999999)).padStart(6,'0'),u:codes[Math.floor(r()*codes.length)],
      price,cost:Math.round(price*(1-m)*100)/100,stock:r()<.15?0:(r()<.25?Math.floor(r()*30):Math.floor(r()*700)),min:10+Math.floor(r()*70),active:i%8!==3,desc:DESC,
      created:'23/10/2026 23:07',updated:'24/10/2026 21:35'};
  }
  out.sort((a,b)=>a.name<b.name?-1:a.name>b.name?1:(a.sku<b.sku?-1:1));
  return out;
})();
const byId=new Map(data.map(p=>[p.id,p]));
let nextId=data.length;
const unitLabel=code=>{const u=state.units.find(x=>x[0]===code);return u?`${u[0]} · ${u[1]}`:code};
let list=data;
const isLow=p=>p.stock<p.min;

function computeList(){
  const q=state.q.trim().toLowerCase();
  list=data.filter(p=>{
    if(state.filter==='active'&&!p.active)return false;
    if(state.filter==='inactive'&&p.active)return false;
    if(state.cat!==''&&p.c!==+state.cat)return false;
    if(state.stock==='low'&&!isLow(p))return false;
    if(state.stock==='zero'&&p.stock!==0)return false;
    if(q&&!(p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)))return false;
    return true;
  });
}

/* ---------- shell ---------- */
const NAV=[
  {g:null,items:[['home','Início','dash']]},
  {g:'Cadastros',items:[['products','Produtos','package'],['partners','Parceiros','users']]},
  {g:'Operação',items:[['stock','Estoque','layers'],['sales','Vendas','receipt']]},
  {g:'Financeiro',items:[['finance','Financeiro','wallet']]}
];
const activeNav=()=>({edit:'products',units:'products'}[state.view]||state.view);
function renderSidebar(){
  const a=activeNav();
  $('#sidebar').innerHTML=`
   <div class="brand"><div class="logo">E</div><div><b>ERP Demo</b><span>Gestão comercial</span></div></div>
   <nav>${NAV.map(g=>`${g.g?`<div class="glabel">${g.g}</div>`:''}${g.items.map(([id,l,i])=>`<button class="navitem ${a===id?'active':''}" data-go="${id}" title="${l}">${ic(i,18)}<span class="lbl">${l}</span></button>`).join('')}`).join('')}</nav>
   <div class="sfoot">
     <button class="navitem ${a==='settings'?'active':''}" data-go="settings" title="Configurações">${ic('sliders',18)}<span class="lbl">Configurações</span></button>
     <button class="navitem" data-act="collapse" title="Recolher">${ic('panel',18)}<span class="lbl">Recolher</span></button>
   </div>`;
}
const STYLES=[['neutral','Neutral'],['linear','Linear'],['warm','Warm'],['fintech','Fintech']];
function crumbs(){
  const b=(l,go)=>`<button data-go="${go}">${l}</button>`,sep=ic('right',14);
  switch(state.view){
    case 'products':return `${b('Cadastros','products')}${sep}<span class="cur">Produtos</span>`;
    case 'edit':return `${b('Cadastros','products')}${sep}${b('Produtos','products')}${sep}<span class="cur">${state.editing==='new'?'Novo produto':'Editar produto'}</span>`;
    case 'units':return `${b('Cadastros','products')}${sep}${b('Produtos','products')}${sep}<span class="cur">Unidades</span>`;
    case 'settings':return `<span class="cur">Configurações</span>`;
    default:{const n=NAV.flatMap(g=>g.items).find(i=>i[0]===state.view);return `<span class="cur">${n?n[1]:''}</span>`}
  }
}
function renderTopbar(){
  const dark=document.documentElement.dataset.theme==='dark';
  $('#topbar').innerHTML=`
   <div class="crumbs">${crumbs()}</div>
   <button class="cmd" data-act="cmd">${ic('search')}<span>Buscar ou ir para…</span><kbd>Ctrl K</kbd></button>
   <div class="tright">
     <span class="env">Ambiente de demonstração</span>
     <label class="stylepick" title="Trocar a direção de estilo do protótipo">${ic('palette',15)}<span class="t">Direção</span>
       <select id="stylesel" aria-label="Direção de estilo">${STYLES.map(([v,l])=>`<option value="${v}" ${document.documentElement.dataset.style===v?'selected':''}>${l}</option>`).join('')}</select></label>
     <button class="iconbtn" title="Notificações">${ic('bell',18)}</button>
     <button class="iconbtn" data-act="theme" title="Alternar tema">${ic(dark?'sun':'moon',18)}</button>
     <div class="user"><div class="avatar">A</div><div><b>Administrador</b><small>Administrador</small></div></div>
   </div>`;
  $('#stylesel').addEventListener('change',e=>{document.documentElement.dataset.style=e.target.value;try{localStorage.setItem('erp-style',e.target.value)}catch(_){}toast('Direção '+e.target.selectedOptions[0].text,'Mesma estrutura, tokens diferentes.')});
}

/* ---------- popovers / dialogs / toasts ---------- */
const pop=$('#pop');let popOwner=null;
function closePop(){pop.style.display='none';pop.innerHTML='';if(popOwner){popOwner.classList.remove('open');popOwner.removeAttribute('data-popowner')}popOwner=null}
function placePop(btn,align){
  const r=btn.getBoundingClientRect();pop.style.display='block';
  const w=pop.offsetWidth,h=pop.offsetHeight;
  let left=align==='right'?r.right-w:r.left;left=Math.max(8,Math.min(left,innerWidth-w-8));
  let top=r.bottom+4;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-4);
  pop.style.left=left+'px';pop.style.top=top+'px';
}
function openSelect(btn,{options,value,onPick,search}){
  if(popOwner===btn){closePop();return}
  closePop();popOwner=btn;btn.dataset.popowner='1';btn.classList.add('open');
  pop.style.minWidth=Math.max(btn.offsetWidth,200)+'px';
  pop.innerHTML=(search?`<div class="pop-search">${ic('search',15)}<input placeholder="Buscar…" aria-label="Buscar"></div>`:'')+`<div id="plist"></div>`;
  const draw=q=>{
    const f=options.filter(o=>o.label.toLowerCase().includes((q||'').toLowerCase()));
    $('#plist').innerHTML=f.length?f.map(o=>`<button class="opt" data-v="${esc(o.value)}"><span class="chk">${String(o.value)===String(value)?ic('check',15):''}</span>${esc(o.label)}</button>`).join(''):`<div class="pop-empty">Nenhum resultado</div>`;
    $$('#plist .opt').forEach(b=>b.onclick=()=>{const v=b.dataset.v;closePop();onPick(v)});
  };
  draw('');placePop(btn);
  const inp=$('.pop-search input',pop);if(inp){inp.focus();inp.addEventListener('input',()=>{draw(inp.value);placePop(btn)})}
}
function openMenu(btn,items){
  if(popOwner===btn){closePop();return}
  closePop();popOwner=btn;btn.dataset.popowner='1';pop.style.minWidth='180px';
  pop.innerHTML=items.map((it,i)=>`<button class="opt ${it.danger?'danger':''}" data-i="${i}">${ic(it.icon,15)}${it.label}</button>`).join('');
  $$('.opt',pop).forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];closePop();it.run()});
  placePop(btn,'right');
}
document.addEventListener('mousedown',e=>{if(pop.style.display==='block'&&!pop.contains(e.target)&&!e.target.closest('[data-popowner]'))closePop()});
addEventListener('resize',closePop);
$('#content').addEventListener('scroll',closePop);

const overlay=$('#overlay');
function openDialog(html,{top=false,onMount}={}){
  overlay.className=top?'top':'';overlay.innerHTML=html;overlay.style.display='flex';
  overlay.onmousedown=e=>{if(e.target===overlay)closeDialog()};
  if(onMount)onMount(overlay);
  const f=overlay.querySelector('input,button.primary');if(f)f.focus();
}
function closeDialog(){overlay.style.display='none';overlay.innerHTML='';overlay.onmousedown=null}
function toast(t,d){
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=`${ic('cok',18)}<div><b>${t}</b>${d?`<p>${d}</p>`:''}</div>`;
  $('#toasts').append(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),220)},3400);
}

/* ---------- views ---------- */
function go(view,param){
  closePop();state.view=view;if(view==='edit')state.editing=param;
  renderSidebar();renderTopbar();
  ({products:renderProducts,edit:renderEdit,units:renderUnits,settings:renderSettings}[view]||renderPlaceholder)();
  $('#content').scrollTop=0;
}

/* --- Produtos --- */
const ROW=52;
function counts(){let a=0;for(const p of data)if(p.active)a++;return{all:data.length,a,i:data.length-a}}
function statsHtml(){
  const c=counts(),f=state.filter;
  const s=(id,k,v,d)=>`<button class="stat ${f===id?'on':''}" data-filter="${id}"><div class="k">${k}</div><div class="v">${fmtInt(v)}</div><div class="d">${d}</div></button>`;
  return s('all','Todos',c.all,'Em todo o catálogo')+s('active','Ativos',c.a,Math.round(c.a/c.all*100)+'% do catálogo')+s('inactive','Inativos',c.i,'Fora das vendas')+
    `<div class="stat"><div class="k">Categorias</div><div class="v">${CATS.length}</div><div class="d">Organizam o catálogo</div></div>`;
}
function rowHtml(p){
  const low=isLow(p);
  return `<div class="tr cols" data-id="${p.id}">
    <div><div class="pn">${esc(p.name)}</div><div class="pc">${CATS[p.c][0]}</div></div>
    <div class="sku mono">${p.sku}</div>

function sync(){

function saveProduct(){
  let bad=false;
  const chk=(cond,id,key)=>{if(cond){bad=true;$('#'+id).classList.add('err');$('#e-'+key).hidden=false}};
  chk(!draft.name.trim(),'f-name','name');chk(!(draft.cost>0),'f-cost','cost');chk(!(draft.price>0),'f-price','price');chk(draft.min==='','f-min','min');
  if(bad){const f=$('.input.err');if(f)f.focus();return}
  const now=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(',','');
  let p;
  if(state.editing==='new'){
    p={id:nextId++,active:true,stock:0,created:now};data.unshift(p);byId.set(p.id,p);state.editing=p.id;
  }else p=byId.get(state.editing);
  Object.assign(p,{name:draft.name.trim(),sku:draft.sku||(CATS[draft.c][1]+'-'+String(p.id).padStart(6,'0')),c:draft.c,u:draft.u,desc:draft.desc,cost:draft.cost,price:draft.price,min:+draft.min,updated:now});
  orig=JSON.stringify(draft);$('#s-upd').textContent=now;sync();

}

/* --- command palette --- */
function openPalette(){
  const items=[
    ['Navegar','Produtos','package',()=>go('products')],['Navegar','Unidades de medida','ruler',()=>go('units')],['Navegar','Configurações','sliders',()=>go('settings')],
    ['Ações','Novo produto','plus',()=>go('edit','new')],['Ações','Nova unidade','plus',()=>{go('units');unitDialog(null)}],
    ['Aparência','Alternar tema claro/escuro','sun',toggleTheme],...STYLES.map(([v,l])=>['Aparência','Direção '+l,'palette',()=>{document.documentElement.dataset.style=v;renderTopbar()}])
  ];
  let sel=0,cur=items;
  openDialog(`<div class="pal"><div class="in">${ic('search',18)}<input id="pi" placeholder="Digite um comando ou busque…" autocomplete="off"><kbd>Esc</kbd></div><div class="list" id="pl"></div></div>`,{top:true,onMount:()=>{
    const draw=()=>{
      let last='';$('#pl').innerHTML=cur.map((it,i)=>{const h=it[0]!==last?`<div class="grp">${it[0]}</div>`:'';last=it[0];return `${h}<button class="opt ${i===sel?'hl':''}" data-i="${i}"><span class="chk" style="color:var(--muted-fg)">${ic(it[2],16)}</span>${it[1]}</button>`}).join('')||'<div class="pop-empty">Nenhum comando encontrado</div>';
      $$('#pl .opt').forEach(b=>{b.onclick=()=>run(+b.dataset.i);b.onmouseenter=()=>{sel=+b.dataset.i;$$('#pl .opt').forEach(x=>x.classList.toggle('hl',+x.dataset.i===sel))}});
    };
    const run=i=>{const it=cur[i];if(!it)return;closeDialog();it[3]()};
    $('#pi').addEventListener('input',e=>{const q=e.target.value.toLowerCase();cur=items.filter(i=>i[1].toLowerCase().includes(q));sel=0;draw()});
    $('#pi').addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(cur.length-1,sel+1);draw()}
      if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);draw()}
      if(e.key==='Enter')run(sel);
    });
    draw();
  }});
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-filter],[data-edit],[data-more],[data-unit],[data-delunit],.tr');if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.filter){state.filter=t.dataset.filter;$('#stats').innerHTML=statsHtml();refreshTable();return}
  if(t.dataset.edit){go('edit',+t.dataset.edit);return}
  if(t.dataset.more){
    const p=byId.get(+t.dataset.more);
    openMenu(t,[
      {label:'Editar',icon:'pencil',run:()=>go('edit',p.id)},
      {label:'Duplicar',icon:'copy',run:()=>{const c={...p,id:nextId++,name:p.name+' (cópia)',sku:p.sku.slice(0,4)+String(nextId).padStart(6,'0')};data.unshift(c);byId.set(c.id,c);state.q='';refreshTable();$('#stats').innerHTML=statsHtml();toast('Produto duplicado',c.name)}},
      {label:p.active?'Desativar':'Ativar',icon:'power',danger:p.active,run:()=>{p.active=!p.active;$('#stats').innerHTML=statsHtml();refreshTable(false);toast(p.active?'Produto ativado':'Produto desativado',p.name)}}
    ]);return;
  }
  if(t.dataset.unit){unitDialog(+t.dataset.unit);return}
  if(t.dataset.delunit){const i=+t.dataset.delunit;const u=state.units.splice(i,1)[0];renderUnits();toast('Unidade excluída',u[0]+' · '+u[1]);return}
  if(t.classList.contains('tr')){go('edit',+t.dataset.id);return}
  switch(t.dataset.act){
    case 'collapse':$('#app').classList.toggle('collapsed');break;
    case 'theme':toggleTheme();break;
    case 'cmd':openPalette();break;
    case 'cats':toast('Categorias','Esta tela segue o mesmo padrão de Unidades.');break;
    case 'newproduct':go('edit','new');break;
    case 'newunit':unitDialog(null);break;
    case 'closedlg':closeDialog();break;
    case 'saveproduct':saveProduct();break;
    case 'savesettings':toast('Configurações salvas','As regras valem para as próximas vendas.');break;
    case 'clear':state.q='';state.cat='';state.stock='all';state.filter='all';renderProducts();break;
  }
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();overlay.style.display==='flex'?closeDialog():openPalette();return}
  if(e.key==='Escape'){if(pop.style.display==='block')closePop();else if(overlay.style.display==='flex')closeDialog()}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&overlay.style.display!=='flex'){const q=$('#q')||$('#uq');if(q){e.preventDefault();q.focus()}}
});

/* ---------- boot ---------- */
(function(){
  let th=null,st=null;try{th=localStorage.getItem('erp-theme');st=localStorage.getItem('erp-style')}catch(_){}
  const h=document.documentElement;
  h.dataset.theme=th||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  if(st)h.dataset.style=st;
  go('products');
})();
</script>
</body>
</html>
