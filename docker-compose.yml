name: metra

# Ambiente completo: docker compose up -d --build
# Variáveis vêm do arquivo .env (copie de .env.example).
services:
  mysql:
    image: mysql:9.7
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Erp: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD}"
      Cors__AllowedOrigins__0: "http://localhost:${WEB_PORT:-8080}"
      # Admin inicial: criado só se não houver nenhum usuário. Demo: operador@erp.local e leitura@erp.local.
      Auth__BootstrapAdmin__Email: ${ADMIN_EMAIL:-admin@erp.local}
      Auth__BootstrapAdmin__Password: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      Auth__DemoUsersPassword: ${DEMO_USERS_PASSWORD:-}
      DataProtection__KeysPath: /data/keys
    volumes:
      - api-keys:/data/keys
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mysql-data:
  api-keys:
