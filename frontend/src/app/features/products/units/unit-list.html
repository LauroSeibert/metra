<erp-page-header [title]="strings.title" [subtitle]="strings.subtitle">
  <a matButton="outlined" class="erp-secondary-action" routerLink="/products">
    <mat-icon>arrow_back</mat-icon>
    {{ common.back }}
  </a>
  @if (canWrite()) {
    <button matButton="filled" class="erp-primary-action" type="button" (click)="open(null)">
      <mat-icon>add</mat-icon>
      {{ strings.newUnit }}
    </button>
  }
</erp-page-header>

<erp-data-table
  [columns]="columns"
  [rows]="rows()"
  [rowKey]="rowKey"
  [loading]="units.isLoading()"
  [error]="loadError()"
  [emptyMessage]="strings.empty"
  [total]="total()"
  [page]="page()"
  [pageSize]="pageSize()"
  (pageChange)="onPage($event)"
  (retry)="units.reload()"
  (rowActivate)="canWrite() && open($event)"
>
  <section tableToolbar class="erp-toolbar" [attr.aria-label]="strings.searchLabel">
    <mat-form-field class="grow" subscriptSizing="dynamic">
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        erpSlashFocus
        type="search"
        [attr.aria-label]="strings.searchLabel"
        [placeholder]="strings.searchLabel"
        [value]="search()"
        (input)="onSearchInput($event)"
      />
      <span matSuffix class="erp-kbd" aria-hidden="true">/</span>
    </mat-form-field>
  </section>

  <ng-template erpCell="code" [erpCellOf]="rows()" let-unit>
    <erp-status-chip [label]="unit.code" tone="primary" />
  </ng-template>

  <ng-template erpCell="productCount" [erpCellOf]="rows()" let-unit>
    {{ unit.productCount | number }}
  </ng-template>

  <ng-template erpCell="actions" [erpCellOf]="rows()" let-unit>
    @if (canWrite()) {
      <div class="erp-row-actions">
        <button
          class="erp-row-action"
          type="button"
          [matTooltip]="common.edit"
          [attr.aria-label]="common.edit + ' ' + unit.code"
          (click)="open(unit)"
        >
          <mat-icon>edit_square</mat-icon>
        </button>
        <button
          class="erp-row-action danger"
          type="button"
          [disabled]="unit.productCount > 0"
          [matTooltip]="unit.productCount > 0 ? strings.inUse : common.delete"
          [attr.aria-label]="common.delete + ' ' + unit.code"
          (click)="remove(unit)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    }
  </ng-template>
</erp-data-table>
