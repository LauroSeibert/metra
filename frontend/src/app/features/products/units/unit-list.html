<erp-page-header [title]="strings.title" [subtitle]="strings.subtitle">
  <a hlmBtn variant="outline" routerLink="/products">
    <erp-icon name="arrow-left" />
    {{ common.back }}
  </a>
  @if (canWrite()) {
    <button hlmBtn type="button" (click)="open(null)">
      <erp-icon name="plus" />
      {{ strings.newUnit }}
    </button>
  }
</erp-page-header>

<erp-data-table
  [columns]="columns"
  [rows]="rows()"
  [rowKey]="rowKey"
  [loading]="units.isLoading()"
  [error]="loadError()"
  [emptyMessage]="strings.empty"
  [total]="total()"
  [page]="page()"
  [pageSize]="pageSize()"
  (pageChange)="onPage($event)"
  (retry)="units.reload()"
  (rowActivate)="canWrite() && open($event)"
>
  <section
    tableToolbar
    class="flex flex-wrap items-center gap-2.5 border-b border-border p-3.5"
    [attr.aria-label]="strings.searchLabel"
  >
    <div class="relative min-w-56 flex-1">
      <erp-icon
        name="search"
        class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-muted-foreground"
      />
      <input
        #searchInput
        hlmInput
        erpSlashFocus
        type="search"
        class="pr-10 pl-9"
        [attr.aria-label]="strings.searchLabel"
        [placeholder]="strings.searchLabel"
        [value]="search()"
        (input)="onSearchInput($event)"
      />
      @if (search()) {
        <button
          hlmBtn
          variant="ghost"
          size="icon-xs"
          type="button"
          class="absolute top-1/2 right-2 -translate-y-1/2"
          [attr.aria-label]="strings.clearSearch"
          [hlmTooltip]="strings.clearSearch"
          (click)="clearSearch(searchInput)"
        >
          <erp-icon name="x" [size]="14" />
        </button>
      } @else {
        <span
          class="erp-kbd pointer-events-none absolute top-1/2 right-2.5 -translate-y-1/2"
          aria-hidden="true"
          >/</span
        >
      }
    </div>
  </section>

  <ng-template erpCell="code" [erpCellOf]="rows()" let-unit>
    <span hlmBadge variant="code">{{ unit.code }}</span>
  </ng-template>

  <ng-template erpCell="productCount" [erpCellOf]="rows()" let-unit>
    {{ unit.productCount | number }}
  </ng-template>

  <ng-template erpCell="actions" [erpCellOf]="rows()" let-unit>
    @if (canWrite()) {
      <div class="inline-flex items-center gap-1">
        <button
          hlmBtn
          variant="ghost"
          size="icon"
          type="button"
          [hlmTooltip]="common.edit"
          [attr.aria-label]="common.edit + ' ' + unit.code"
          (click)="open(unit)"
        >
          <erp-icon name="pencil" />
        </button>
        <!-- Botão desabilitado não recebe o mouse: a dica fica no invólucro. -->
        <span [hlmTooltip]="unit.productCount > 0 ? strings.inUse : common.delete">
          <button
            hlmBtn
            variant="ghost"
            size="icon"
            type="button"
            class="text-destructive hover:text-destructive"
            [disabled]="unit.productCount > 0"
            [attr.aria-label]="common.delete + ' ' + unit.code"
            (click)="remove(unit)"
          >
            <erp-icon name="trash" />
          </button>
        </span>
      </div>
    }
  </ng-template>
</erp-data-table>
