<nav class="nav" [attr.aria-label]="strings.mainNav">
  @for (group of groups; track group.label) {
    <section class="group">
      <h2 class="group-label">{{ group.label }}</h2>
      <ul>
        @for (item of group.items; track item.path) {
          <li>
            @if (item.available) {
              <a
                class="item"
                [routerLink]="item.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.path === '/' }"
                [matTooltip]="item.label"
                [matTooltipDisabled]="!compact()"
                matTooltipPosition="right"
              >
                <mat-icon>{{ item.icon }}</mat-icon>
                <span class="label">{{ item.label }}</span>
              </a>
            } @else {
              <span
                class="item disabled"
                aria-disabled="true"
                [matTooltip]="item.label + ' · ' + strings.comingSoon"
                [matTooltipDisabled]="!compact()"
                matTooltipPosition="right"
                [attr.aria-label]="item.label + ' (' + strings.comingSoon + ')'"
              >
                <mat-icon>{{ item.icon }}</mat-icon>
                <span class="label">{{ item.label }}</span>
                <span class="soon">{{ strings.comingSoon }}</span>
              </span>
            }
          </li>
        }
      </ul>
    </section>
  }
</nav>

@if (canCollapse()) {
  <button
    type="button"
    class="collapse"
    [attr.aria-label]="compact() ? strings.expandMenu : strings.collapseMenu"
    [attr.aria-expanded]="!compact()"
    (click)="toggleCollapse.emit()"
  >
    <mat-icon>{{ compact() ? 'left_panel_open' : 'left_panel_close' }}</mat-icon>
    <span class="label">{{ strings.collapseMenu }}</span>
  </button>
}
