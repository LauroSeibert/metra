@if (showMenuButton()) {
  <button
    matIconButton
    type="button"
    class="menu"
    [attr.aria-label]="menuOpen() ? strings.closeMenu : strings.openMenu"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu.emit()"
  >
    <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
  </button>
}

<nav class="breadcrumb" [attr.aria-label]="strings.breadcrumb">
  <ol>
    @for (label of breadcrumb(); track $index; let last = $last) {
      <li [attr.aria-current]="last ? 'page' : null">{{ label }}</li>
    }
  </ol>
</nav>

<erp-command-search class="search" />

<div class="actions">
  <span class="demo">{{ strings.demoBadge }}</span>
  <button
    matIconButton
    type="button"
    class="help"
    [title]="strings.help"
    [attr.aria-label]="strings.help"
  >
    <mat-icon>help</mat-icon>
  </button>
  <button
    matIconButton
    type="button"
    [title]="strings.notifications"
    [attr.aria-label]="strings.notifications"
  >
    <mat-icon>notifications</mat-icon>
  </button>
  <button
    matIconButton
    type="button"
    class="theme-toggle"
    [class.dark]="isDark()"
    [title]="isDark() ? strings.toLightTheme : strings.toDarkTheme"
    [attr.aria-label]="isDark() ? strings.toLightTheme : strings.toDarkTheme"
    [disabled]="savingTheme()"
    (click)="toggleTheme()"
  >
    <mat-icon class="sun" aria-hidden="true">light_mode</mat-icon>
    <mat-icon class="moon" aria-hidden="true">dark_mode</mat-icon>
  </button>
  <button
    type="button"
    class="profile"
    [attr.aria-label]="strings.profile"
    popovertarget="account-menu"
  >
    <span class="avatar" aria-hidden="true">{{ initials() }}</span>
    <span class="who">
      <strong>{{ profile()?.fullName }}</strong>
      <small>{{ roleName() }}</small>
    </span>
  </button>
  <!-- Popover nativo do HTML: fecha com Esc e com clique fora, sem JavaScript extra no bundle. -->
  <div id="account-menu" class="account-menu" popover role="menu">
    <div class="menu-header" aria-hidden="true">
      <strong>{{ profile()?.fullName }}</strong>
      <small>{{ profile()?.email }}</small>
    </div>
    <a class="menu-item" role="menuitem" routerLink="/profile" (click)="closeMenu()">
      <mat-icon>manage_accounts</mat-icon>
      <span>{{ strings.myProfile }}</span>
    </a>
    <button class="menu-item" role="menuitem" type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>{{ strings.logout }}</span>
    </button>
  </div>
</div>
