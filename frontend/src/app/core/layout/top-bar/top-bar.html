@if (showMenuButton()) {
  <button
    hlmBtn
    variant="ghost"
    size="icon"
    type="button"
    [attr.aria-label]="menuOpen() ? strings.closeMenu : strings.openMenu"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu.emit()"
  >
    <erp-icon [name]="menuOpen() ? 'x' : 'menu'" [size]="18" />
  </button>
}

<nav class="min-w-0 flex-1 basis-0" [attr.aria-label]="strings.breadcrumb">
  <ol class="m-0 flex list-none items-center gap-1.5 p-0 text-sm whitespace-nowrap">
    @for (label of breadcrumb(); track $index; let first = $first; let last = $last) {
      <li class="flex items-center gap-1.5" [attr.aria-current]="last ? 'page' : null">
        @if (!first) {
          <erp-icon name="chevron-right" [size]="14" class="text-subtle-foreground" />
        }
        <span [class]="last ? 'truncate font-medium text-foreground' : 'text-muted-foreground'">{{
          label
        }}</span>
      </li>
    }
  </ol>
</nav>

<button
  hlmBtn
  variant="outline"
  type="button"
  class="hidden h-button w-full max-w-sm shrink justify-between font-normal text-muted-foreground sm:inline-flex"
  aria-keyshortcuts="Control+K Meta+K"
  [attr.aria-label]="strings.palette.open"
  (click)="palette.toggle()"
>
  <span class="flex items-center gap-2"
    ><erp-icon name="search" />{{ strings.palette.placeholder }}</span
  >
  <span class="erp-kbd" aria-hidden="true">Ctrl K</span>
</button>
<div class="flex flex-1 basis-0 items-center justify-end gap-1">
  <button
    hlmBtn
    variant="ghost"
    size="icon"
    type="button"
    class="sm:hidden"
    [attr.aria-label]="strings.palette.open"
    (click)="palette.toggle()"
  >
    <erp-icon name="search" [size]="18" />
  </button>

  <span hlmBadge variant="warn" class="mr-2 hidden before:hidden lg:inline-flex">{{
    strings.demoBadge
  }}</span>

  <button
    hlmBtn
    variant="ghost"
    size="icon"
    type="button"
    [title]="strings.notifications"
    [attr.aria-label]="strings.notifications"
  >
    <erp-icon name="bell" [size]="18" />
  </button>
  <button
    hlmBtn
    variant="ghost"
    size="icon"
    type="button"
    [title]="theme.isDark() ? strings.toLightTheme : strings.toDarkTheme"
    [attr.aria-label]="theme.isDark() ? strings.toLightTheme : strings.toDarkTheme"
    [disabled]="theme.saving()"
    (click)="theme.toggle()"
  >
    <erp-icon [name]="theme.isDark() ? 'sun' : 'moon'" [size]="18" />
  </button>

  <div class="mx-2 h-6 w-px bg-border" aria-hidden="true"></div>
  <button
    type="button"
    class="flex cursor-pointer items-center gap-2 rounded-md border-0 bg-transparent p-1 text-left outline-none hover:bg-accent focus-visible:shadow-focus"
    align="end"
    [hlmDropdownMenuTrigger]="account"
    [attr.aria-label]="strings.profile"
  >
    <hlm-avatar size="sm"
      ><span hlmAvatarFallback class="text-xs font-medium">{{ initials() }}</span></hlm-avatar
    >
    <span class="hidden flex-col leading-tight md:flex">
      <strong class="text-sm font-medium">{{ profile()?.fullName }}</strong>
      <small class="text-caption text-muted-foreground">{{ roleName() }}</small>
    </span>
  </button>
</div>

<ng-template #account>
  <div hlmDropdownMenu class="w-56">
    <div hlmDropdownMenuLabel class="flex flex-col gap-0.5">
      <strong class="font-medium">{{ profile()?.fullName }}</strong>
      <small class="font-normal text-muted-foreground">{{ profile()?.email }}</small>
    </div>
    <div hlmDropdownMenuSeparator></div>
    <button hlmDropdownMenuItem type="button" (click)="openProfile()">
      <erp-icon name="user-cog" />
      {{ strings.myProfile }}
    </button>
    <button hlmDropdownMenuItem type="button" (click)="logout()">
      <erp-icon name="log-out" />
      {{ strings.logout }}
    </button>
  </div>
</ng-template>
