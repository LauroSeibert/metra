<header class="top"><ng-content select="[shellTopBar]" /></header>
@if (mobile() && navOpen()) {
  <div class="backdrop" aria-hidden="true" (click)="closeNav.emit()"></div>
}
<aside class="side" [attr.aria-hidden]="mobile() && !navOpen() ? true : null">
  <ng-content select="[shellNav]" />
</aside>
<main class="content">
  <div class="page"><ng-content /></div>
</main>
